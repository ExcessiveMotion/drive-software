    permissions: "read/write"

  current_loop_i_gain:
    value: .1
    var_type: "float"
    unit: ""
    readable_name: "Integral gain for current loop"
    description: "Integral gain for current loop"
    permissions: "read/write"

  current_loop_i_limit:
    value: 300.0
    var_type: "float"
    unit: ""
    readable_name: "Integral limit for current loop"
    description: "Integral limit for current loop"
    permissions: "read/write"

  foc_commutation_filter_q:
    value: 100.0
    var_type: "float"
    unit: ""
    readable_name: "Commutation filter q"
    description: "Commutation kalman filter q"
    permissions: "read/write"

  foc_commutation_filter_r_res:
    value: 1024
    var_type: "uint16_t"
    unit: ""
    readable_name: "Commutation filter r angle cnts"
