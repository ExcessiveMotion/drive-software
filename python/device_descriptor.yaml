    description: "Maximum output voltage (PWM dutycycle)"
    permissions: "read/write"

  pfc_target_voltage:
    value: 24000
    var_type: "uint16_t"
    unit: "millivolts"
    readable_name: "PFC target voltage"
    description: "Target voltage for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  pfc_max_positive_current:
    value: 1000
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "PFC max positive current"
    description: "Max current input to the drive from mains"
    permissions: "read/write"

  pfc_max_negative_current:
    value: 1000
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "PFC max negative current"
