hard_parameters: 
  
  # TODO reword
  # DO NOT MODIFY THESE VALUES UNLESS YOU KNOW WHAT YOU ARE DOING
  # incorrect values may result in catastrophic hardware failure
  # these are set at build time and cannot be modified by the controller


  MESSAGE:
    value: 0b0001 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Normal message"

  WARNING:
    value: 0b0010 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Warning message"

  ERROR:
    value: 0b0100 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Error message"

  CRITICAL:
    value: 0b1000 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Critical error message"

  max_fan_speed_rpm:
    value: 12400
    var_type: "uint32_t"
    unit: "rpm"
    readable_name: "Max fan speed"
    description: "Maximum fan speed in RPM"

  adc_hv_sense_divider:
    value: 225
    var_type: "float"
    unit: "volts"
    readable_name: "ADC HV sense divider"
    description: "Divider for the high voltage sense ADC inputs"

  shunt_resistance:
    value: 0.005
    var_type: "float"
    unit: "ohms"
    readable_name: "Current sense resistance"
    description: "Value of the resistors used to measure phase current.\nThese may be changed to better support lower current motors but it is not recomended."
  
  min_dc_bus_voltage:
    value: 24
    var_type: "uint16_t"
    unit: "volts"
    readable_name: "Minimum DC bus voltage"
    description: "Undervoltage protection will trip if the bus drops below this value."

  max_dc_bus_voltage:
    value: 410
    var_type: "uint16_t"
    unit: "volts"
    readable_name: "Maximum DC bus voltage"
    description: "Overvoltage protection will trip if the bus rises above this value."

  max_phase_current:
    value: 20000
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "Max allowed phase current"
    description: "Maximum current allowed through an output phase before overcurrent protection is tripped."

  max_imbalance_current:
    value: 1500
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "Max allowed phase current imbalance"
    description: "Maximum difference allowed between phase currents before overcurrent protection is tripped."

  heatsink_over_temp_limit:
    value: 55
    var_type: "uint8_t"
    unit: "celsius"
    readable_name: "Heatsink overtemp limit"
    description: "Heatsink temperature at which overheat protection will trip"

  board_over_temp_limit:
    value: 55
    var_type: "uint8_t"
    unit: "celsius"
    readable_name: "PCB overtemp limit"
    description: "PCB temperature at which overheat protection will trip"

  board_ntc_therm_beta:
    value: 3500
    var_type: "uint16_t"
    unit: "k"
    readable_name: "NTC thermistor beta value"
    description: "Beta value of the NTC thermistor used to measure PCB temperature"

  heatsink_ntc_therm_beta:
    value: 3950
    var_type: "uint16_t"
    unit: "k"
    readable_name: "NTC thermistor beta value"
    description: "Beta value of the NTC thermistors used to measure heatsink and ambient air temperature"

  sysclk:
    value: 100
    var_type: "uint32_t"
    unit: "Mhz"
    readable_name: "System clock frequency"
    description: "System clock frequency"

  vcxo_pwm_clk:
    value: 2
    var_type: "uint16_t"
    unit: "khz"
    readable_name: "VCXO PWM clock frequency"
    description: "VCXO PWM clock frequency"

  systick_frequency:
    value: 100
    var_type: "uint32_t"
    unit: "Hz"
    readable_name: "System tick frequency"
    description: "System tick frequency, do not set above 1khz"

  deadtime:
    value: 20
    var_type: "uint32_t"
    unit: "ns"
    readable_name: "Phase PWM deadtime"
    description: "Phase PWM deadtime to prevent high and low side fets being on at the same time"

  pwmclk:
    value: 25
    var_type: "uint32_t"
    unit: "khz"
    readable_name: "Phase PWM output frequency"
    description: "Phase PWM output frequency"

  adc_enable_delay_cycles:
    value: 30
    var_type: "uint32_t"
    unit: "count"
    readable_name: "ADC enable delay cycles"
    description: "How many cycles it takes for the ADCs to power on after phase PWM is enabled"

  adcclk:
    value: 20
    var_type: "uint32_t"
    unit: "MHz"
    readable_name: "Phase ADC clock frequency"
    description: "Phase ADC clock frequency"

  adc_voltage:
    value: 0.250
    var_type: "float"
    unit: "volts"
    readable_name: "ADC optimal shunt input voltage range"
    description: "ADC optimal shunt input voltage range"

  adc_min_value_percent:
    value: 0.1094
    var_type: "float"
    unit: ""
    readable_name: "" #TODO: figure out what this does
    description: ""
  
  dfsdm_divisions:
    value: 8388608
    var_type: "uint32_t"
    unit: "count"
    readable_name: "" #TODO: figure out what this does
    description: ""

  dfsdm_short_circuit_bit_count:
    value: 127
    var_type: "uint8_t"
    unit: "count"
    readable_name: "Phase ADC short circuit detector consecutive bit count"
    description: "Number of consecutive same bits to receive from the ADC before triggering short circuit detection.\nMax is 127 (ADCs send a different bit every 128 cycles even at full scale)"

  device_starting_address:
    value: 0
    var_type: "uint8_t"
    unit: "address"
    readable_name: "Device starting address"
    description: "rs422 address to start at, DIP switches may be used to increment it, read at power on"

  cyclic_address_count:
    value: 32
    var_type: "uint8_t"
    unit: "count"
    readable_name: "Cyclic address count"
    description: "Maximum number of cyclic addresses that can be configured"
  


registers:
# values meant to be read/written by the controller to configure and use the device

  communication_update_interval:
    value: 200000
    var_type: "uint32_t"
    unit: "10ns"
    readable_name: "Communication update interval"
    description: "How often the controller sends a packet to the device, this is used for clock synchronization. note that is must be an even multiple of main PWM frequency"
    permissions: "read/write"

  pwm_timer_phase_offset:
    value: 0
    var_type: "uint32_t"
    unit: "counts"
    readable_name: "PWM timer phase offset"
    description: "How many counts to delay the start of the main phase PWM timer when synchronizing with the controller"
    permissions: "read/write"

  enable_controller_syncronization:
    value: 1
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable controller synchronization"
    description: "Enable or disable the controller synchronization feature, this is used to synchronize the device clock with the controller"
    permissions: "read/write"

  controller_syncronization_valid:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Controller synchronization is ok"
    description: "Indicates if the device is synchronized with the controller"
    permissions: "read"

  fan_speed_cmd:
    value: 0
    var_type: "uint16_t"
    unit: ""
    readable_name: "Fan speed"
    description: "Cmd fan speed (max 0xffff)"
    permissions: "read/write"

  fan_speed_measured:
    value: 0
    var_type: "uint16_t"
    unit: ""
    readable_name: "Measured fan speed"
    description: "Measured fan speed (max 0xffff)"
    permissions: "read"

  fan_auto_speed_enable:
    value: 1
    var_type: "uint8_t"
    unit: ""
    readable_name: "Auto fan speed enable"
    description: "Enable automatic fan speed control"
    permissions: "read/write"

  fan_zero_speed_temp:
    value: 30
    var_type: "uint8_t"
    unit: "celsius"
    readable_name: "Fan zero speed temperature"
    description: "Temperature at/below which the fan will be off"
    permissions: "read/write"

  fan_max_speed_temp:
    value: 40
    var_type: "uint8_t"
    unit: "celsius"
    readable_name: "Fan max speed temperature"
    description: "Temperature at/above which the fan will be at max speed"
    permissions: "read/write"

  heatsink_temp:
    value: 0
    var_type: "float"
    unit: "celsius"
    readable_name: "Heatsink temperature"
    description: "Measured heatsink temperature"
    permissions: "read"
  
  board_temp:
    value: 0
    var_type: "float"
    unit: "celsius"
    readable_name: "PCB temperature"
    description: "Measured PCB temperature"
    permissions: "read"

  ambient_temp:
    value: 0
    var_type: "float"
    unit: "celsius"
    readable_name: "Ambient temperature"
    description: "Measured ambient temperature"
    permissions: "read"

  current_limit_q:
    value: 1000
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "q axis current limit"
    description: "Maximum current cmd allowed through the q axis"
    permissions: "read/write"

  current_limit_d:
    value: 100
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "d axis current limit"
    description: "Maximum current cmd allowed through the d axis"
    permissions: "read/write"

  current_command_q:
    value: 0
    var_type: "int32_t"
    unit: "milliamps"
    readable_name: "q axis current command"
    description: "q setpoint for the internal current control"
    permissions: "read/write"

  current_command_d:
    value: 0
    var_type: "int32_t"
    unit: "milliamps"
    readable_name: "d axis current command"
    description: "d setpoint for the internal current control"
    permissions: "read/write"

  current_measured_q:
    value: 0
    var_type: "int32_t"
    unit: "milliamps"
    readable_name: "q axis current feedback"
    description: "Actual measured q current through motor"
    permissions: "read"

  current_measured_d:
    value: 0
    var_type: "int32_t"
    unit: "milliamps"
    readable_name: "d axis current feedback"
    description: "Actual measured d current through motor"
    permissions: "read"

  phase_resistance:
    value: 0.0
    var_type: "float"
    unit: "ohms"
    readable_name: "Phase resistance"
    description: "Phase resistance between 2 motor terminals"
    permissions: "read/write"

  commutation_command:
    value: 0
    var_type: "uint16_t"
    unit: "counts"
    readable_name: "Electrical commutation command"
    description: "Value 0-65525 representing the current electrical angle of the motor (or an even multiple of it)"
