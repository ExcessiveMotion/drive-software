
hardware:
  type: 0 #32 bit
  version: 0  #32 bit
  readable_name: "Servo drive (model number goes here)"
  description: "Servo drive designed for industrial high voltage motors"

firmware:
  version: 1
  release_date: "7/18/2024"
  description: "Firmware for (model number goes here) rev (hardware rev number goes here) servo drive"


message_severities:
  none: 0
  info: 1
  warning: 2
  error: 3
  critical: 4

messages:

  fans:
    speed_high:
      readable_name: "Fan speed high"
      description: "Measured fan speed was too high"
      severity: "warning"

    speed_low:
      readable_name: "Fan speed low"
      description: "Measured fan speed was too low"
      severity: "warning"

    speed_zero:
      readable_name: "Fan speed zero"
      description: "Fan speed was zero"
      severity: "warning"

  current_sense:
    overcurrent:
      readable_name: "Overcurrent"
      description: "Measured phase current was too high for the drive"
      severity: "error"

    imbalance:
      readable_name: "Current imbalance"
      description: "Measured leakage current was too high"
      severity: "error"

    measurement_not_ready:
      readable_name: "Current measurement not ready"
      description: "Current measurement was not ready"
      severity: "critical"

    short_circuit_detected:
      readable_name: "Short circuit detected"
      description: "Short circuit detected on one of the phases, this usually indicates a wiring or hardware fault"
      severity: "critical"

    unexpected_current:
      readable_name: "Unexpected current"
      description: "Unexpected current detected, this usually indicates a wiring or hardware fault"
      severity: "critical"

  communication:
    timeout_warning:
      readable_name: "Timeout"
      description: "No valid packets received within the timeout period"
      severity: "warning"

    timeout_error:
      readable_name: "Timeout error"
      description: "No valid packets received within the timeout period, and the current state cannot run without communication"
      severity: "error"

    invalid_address:
      readable_name: "Invalid address"
      description: "read/write attempted on an address that either doesn't exist, or has incompatible permissions"
      severity: "warning"

    invalid_cyclic_config:
      readable_name: "Invalic cyclic config"
      description: "Attempted to configure a cyclic value that either doesn't exist, or has incompatible permissions"
      severity: "warning"

  system:
    overtemp:
      readable_name: "Overtemp"
      description: "Measured temperature from one of the sensors was too high"
      severity: "error"

    temp_sensor_fail:
      readable_name: "Temperature sensor failure"
      description: "Temperature sensor failure detected, this usually indicates a wiring or hardware fault"
      severity: "error"

    overvoltage:
      readable_name: "Overvoltage"
      description: "Measured DC bus voltage was too high"
      time_delay_us: 5e3  # 5ms
      severity: "critical"

    undervoltage:
      readable_name: "Undervoltage"
      description: "Measured DC bus voltage was too low"
      time_delay_us: 100e3  # 100ms
      severity: "warning"

    floating_voltage_too_high:
      readable_name: "Floating voltage too high"
      description: "Measured voltage on the output phases while off was too high"
      severity: "error"

    control_deadline_missed:
      readable_name: "Control deadline missed"
      description: "Control loop did not run in time"
      severity: "critical"

    invalid_state:
      readable_name: "Invalid state"
      description: "Invalid state selected"
      severity: "error"

    invalid_mode:
      readable_name: "Invalid mode"
      description: "Invalid mode selected"
      severity: "error"

    invalid_sub_mode:
      readable_name: "Invalid sub mode"
      description: "Invalid sub mode selected"
      severity: "error"

    could_not_start:
      readable_name: "Could not start"
      description: "Could not start the selected mode"
      severity: "error"

    sto_enable_failed:
      readable_name: "STO enable failed"
      description: "STO inputs were not enabled correctly"
      severity: "error"

    current_sense_not_ready:
      readable_name: "Current sense not ready"
      description: "Current sense was not ready"
      severity: "error"

    watchdog_timeout:
      readable_name: "Watchdog timeout"
      description: "Hardware watchdog triggered the device to reset, this usually indicates a firmware bug or hardware fault"
      severity: "critical"

  phase_pwm:
    voltage_saturation:
      readable_name: "Voltage saturation"
      description: "PWM output was saturated, unable to reach commanded voltage"
      severity: "warning"

    unexpected_disable:
      readable_name: "Unexpected disable"
      description: "Phase PWM was unexpectedly disabled, this usually indicates a hardware fault"
      severity: "critical"


  sto:
    sto_active:
      readable_name: "STO active"
      description: "Safe torque off is active"
      severity: "error"

    sto_fault_matching_channels:
      readable_name: "Channels do not match"
      description: "STO channel feedback shows channels do not match, this usually indicates a wiring or hardware fault"
      time_delay_us: 10e3  # 10ms
      severity: "critical"

    sto_hardware_fault:
      readable_name: "Hardware fault"
      description: "STO internal hardware fault detected, feedback channels active when they should not be"
      time_delay_us: 2e3 # 1ms
      severity: "critical"

  RL_calib_mode:
    inductance_calib_fail:
      readable_name: "Inductance calibration failed"
      description: "Inductance calibration failed, current did not fall within expected range"
      severity: "error"

    resistance_calib_fail:
      readable_name: "Resistance calibration failed"
      description: "Resistance calibration failed, unable to reach calibration current"
      severity: "error"

  foc_commutation_calib:
    fail:
      readable_name: "Commutation calibration failed"
      description: "Commutation calibration failed"
      severity: "warning"
    success:
      readable_name: "Commutation calibration success"
      description: "Commutation calibration success"
      severity: "info"
    out_of_tolerance:
      readable_name: "Commutation calibration out of tolerance"
      description: "Commutation change did not match shaft angle change"
      severity: "warning"
    

  foc_current_loop_calib:
    fail:
      readable_name: "Current loop calibration failed"
      description: "Current loop calibration failed"
      severity: "warning"
    success:
      readable_name: "Current loop calibration success"
      description: "Current loop calibration success"
      severity: "info"
    

  foc_resistance_calib:
    fail:
      readable_name: "Resistance calibration failed"
      description: "Resistance calibration failed, unable to reach calibration current"
      severity: "warning"
    success:
      readable_name: "Resistance calibration success"
      description: "Resistance calibration success"
      severity: "info"
    could_not_reach_current:
      readable_name: "Could not reach calibration current"
      description: "Resistance calibration could not reach desired calibration current"
      severity: "warning"

  foc_bemf_calib:
    fail:
      readable_name: "BEMF calibration failed"
      description: "BEMF calibration failed, unable to reach calibration current"
      severity: "warning"
    success:
      readable_name: "BEMF calibration success"
      description: "BEMF calibration success"
      severity: "info"


