  pfc_voltage_i_gain:
    value: 0.002
    var_type: "float"
    unit: ""
    readable_name: "PFC voltage integral gain"
    description: "Integral gain for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  pfc_voltage_i_limit:
    value: 30.0
    var_type: "float"
    unit: ""
    readable_name: "PFC voltage integral limit"
    description: "Integral limit for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  pfc_current_p_gain:
    value: 10.0
    var_type: "float"
    unit: ""
    readable_name: "PFC current gain"
    description: "Current gain for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  pfc_current_i_gain:
    value: 0.00
    var_type: "float"
    unit: ""
    readable_name: "PFC current integral gain"
    description: "Integral gain for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  pfc_current_i_limit:
    value: 0.0
    var_type: "float"
    unit: ""
    readable_name: "PFC current integral limit"
    description: "Integral limit for the PFC, this is used to regulate the DC bus voltage"
    permissions: "read/write"

  regen_resistance:
    value: 15.0
    var_type: "float"
    unit: "ohms"
    readable_name: "Regen resistance"
    description: "Resistance of the regen resistor"
    permissions: "read/write"

  regen_max_current:
    value: 40000
    var_type: "uint16_t"
    unit: "milliamps"
    readable_name: "Regen peak current"
    description: "Peak regen current limit"
    permissions: "read/write"

  regen_ramp_start:
    value: 38
    var_type: "float"
    unit: "volts"
    readable_name: "Regen ramp start"
    description: "Regen ramp start voltage, where energy will start being sent to the regen resistor"
    permissions: "read/write"

